# meshbox: configuración del broker (14.1). La instala install.sh en
# /etc/mosquitto/conf.d/meshbox.conf; no la edita el panel.
# passwd y acl los administra meshbox-privd (dueño mosquitto, 0640); ambos deben existir
# antes de arrancar Mosquitto.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
max_inflight_messages 20
max_queued_messages 1000
