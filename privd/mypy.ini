# Tipos de privd: solo biblioteca estándar, Python >= 3.11, solo Linux.
# Uso (desde la raíz del repo): mypy --config-file privd/mypy.ini privd/meshbox_privd.py privd/commands
[mypy]
python_version = 3.11
platform = linux
strict = True
warn_unused_ignores = True
mypy_path = privd
explicit_package_bases = True
