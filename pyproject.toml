[project]
name = "meshbox"
version = "0.9.1"
description = "Gateway, mapa web y panel de administración Meshtastic para Raspberry Pi"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marco A. Magnanelli", email = "marcomagna@gmail.com" }]
requires-python = ">=3.13,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "aiomqtt>=2.5",
    "meshtastic>=2.7",
    "cryptography>=44",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "sse-starlette>=2.2",
    "pywebpush>=2.0",
    "orjson>=3.10",
    "psutil>=6.1",
    "tomli-w>=1.1",
    "pmtiles>=3.4",
    "pyjwt[crypto]>=2.10",
    # Windows no trae la base de zonas horarias (zoneinfo); en la Pi se usa la del sistema.
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
meshbox = "meshbox.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "respx>=0.22",
    "time-machine>=2.16",
    "locust>=2.32",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/meshbox"]
# Los estáticos del frontend están en .gitignore: `artifacts` los incluye igual en la rueda.
# (Con force-include, web/.gitkeep entraba dos veces y hatchling no armaba la rueda.)
artifacts = ["backend/src/meshbox/web/**"]

[tool.hatch.build.targets.sdist]
include = ["backend/src", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend/src", "backend/tests", "privd", "scripts"]
extend-exclude = ["frontend", "backend/src/meshbox/web", "deploy/image"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH", "C4", "PIE", "RET", "TID"]
ignore = [
    "S101",    # assert en pruebas
    "RUF001",  # caracteres ambiguos en textos en español
    "RUF002",
    "RUF003",
    "S603",    # subprocess sin shell: revisado a mano (privd)
    "S607",
    "RET504",
    "SIM105",
    "PTH123",  # open() es más claro en varios lugares
    "PTH101",  # os.chmod / os.replace: se usan a propósito (escrituras atómicas)
    "PTH105",
    "E501",    # el formateador se ocupa del largo de línea
    "TID252",  # imports relativos dentro del paquete
]

[tool.ruff.lint.flake8-bugbear]
# Idioma estándar de FastAPI: dependencias y parámetros como valores por defecto.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# SQL armado con identificadores propios (tablas y columnas fijas); los valores van siempre como parámetros.
"backend/src/meshbox/store/**" = ["S608"]
"backend/src/meshbox/auth/users.py" = ["S608"]
"backend/src/meshbox/api/admin/packets.py" = ["S608"]
"backend/src/meshbox/api/admin/users.py" = ["S608"]
"backend/src/meshbox/alerts/channels/webpush.py" = ["S608"]
"backend/tests/**" = ["S", "PTH", "ASYNC"]
"privd/tests/**" = ["S", "PTH"]
"scripts/**" = ["S", "PTH", "T20"]
"backend/src/meshbox/devtools/**" = ["S311", "S112"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
mypy_path = "backend/src"
packages = ["meshbox"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "meshtastic.*",
    "pmtiles.*",
    "pywebpush.*",
    "py_vapid.*",
    "pubsub.*",
    "serial.*",
    "google.protobuf.*",
    "psutil.*",
    "uvloop",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "privd/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requiere Mosquitto real",
    "slow: pruebas largas",
    "linux: solo en Linux",
]
filterwarnings = [
    "ignore::DeprecationWarning:pubsub.*",
    "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["meshbox"]
branch = true
omit = ["*/migrations/*", "*/web/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["backend/tests", "privd/tests", "frontend"]
# B608: el SQL compuesto interpola solo nombres de tablas y columnas definidos en el código; los
# valores van siempre como parámetros. Está revisado y ruff S608 vigila el resto del código
# (excepciones por archivo en [tool.ruff.lint.per-file-ignores]).
# B104: "0.0.0.0" aparece como valor por defecto o de comparación; los binds salen de la config.
skips = ["B608", "B104"]
